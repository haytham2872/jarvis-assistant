[pytest]
# The repository root is the rootdir, so conftest.py there (settings) is always loaded.
testpaths = backend
# Parallel by default (pytest-xdist): the suite went from 14 min to about 2 on 8 cores.
# backend/conftest.py runs a single test file, or --testmon, in one process instead.
addopts = -n auto -p no:cacheprovider
