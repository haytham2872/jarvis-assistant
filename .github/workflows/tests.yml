name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # No model, key, Qdrant or network is needed: the suite stubs them all.
      - name: Tests
        run: python -m pytest backend -q -p no:cacheprovider
